# Generated by dx/scripts/ci-sync from ci-templates/python-lib-micropython.yaml.
# Do not edit directly — change the template and re-run ci-sync.

name: CI

on:
  pull_request:
    branches: [main, test, development]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # The one Python every job runs. The full tier also tests PYTHON_OLDEST,
  # the floor a repo's requires-python declares.
  PYTHON_VERSION: "3.14.7"
  PYTHON_OLDEST: "3.11"
  UV_VERSION: "0.12.17"
  # One pin builds the Unix port and mpy-cross from the same source tag, and the
  # board stubs must match it: a board rejects .mpy files from another version.
  MICROPYTHON_VERSION: "1.29.0"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.f.outputs.code == 'true' || steps.f.outputs.ci == 'true' }}
      is-main: ${{ steps.tier.outputs.is-main }}
      python-versions: ${{ steps.tier.outputs.python-versions }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: f
        with:
          # A file must match every pattern. Under the default, any one match
          # is enough, so '**' alone marks every file as code and no exclusion
          # applies.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!.claude/**'
              - '!.github/**'
              - '!.githooks/**'
              - '!.vscode/**'
              - '!LICENSE'
            # The files under .github/ that change what these jobs run.
            ci:
              - '{.github/workflows/ci.yaml,.github/micropython-package}'
      # The test matrix comes from here, so the template names each Python
      # version once, in env.
      - id: tier
        run: |
          if [[ "${{ github.base_ref }}" == "main" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "is-main=true" >> "$GITHUB_OUTPUT"
            echo "python-versions=[\"$PYTHON_OLDEST\",\"$PYTHON_VERSION\"]" >> "$GITHUB_OUTPUT"
          else
            echo "is-main=false" >> "$GITHUB_OUTPUT"
            echo "python-versions=[\"$PYTHON_VERSION\"]" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - name: Check package.json lists src/ at its version
        run: python3 .github/micropython-package manifest --check
      - name: Check shipped modules import only what a board has
        run: uv run --no-sync python .github/micropython-package subset

  typecheck:
    name: Type Check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - name: Check the board stubs match the MicroPython pin
        run: uv run --no-sync python .github/micropython-package stubs
      - run: uv run --no-sync pyright

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.changes.outputs.python-versions) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      # Installs the package as a built wheel, not an editable link to src/,
      # so a module or data file the build leaves out fails the tests here.
      - run: uv sync --locked --no-editable
      - run: uv run --no-sync pytest

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv build

  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - run: uv run --no-sync coverage run -m pytest
      # The threshold lives here, not in the repo's coverage config, so a repo
      # can't lower it. Line coverage: the repo's config leaves branch off.
      - name: Enforce coverage threshold (>=80%)
        run: uv run --no-sync coverage report --fail-under=80
      - run: uv run --no-sync coverage xml -o coverage/coverage.xml
      - name: Fetch Codecov CLI
        id: codecov-cli
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          # A pinned GitHub release instead of the action's runtime download
          # from cli.codecov.io, whose TLS handshake fails from our runners.
          # Bump both values together.
          CODECOV_CLI_VERSION: v11.3.1
          CODECOV_CLI_SHA256: ca1d64196d2d34771084afe76ea657d581bf628e31d993ff8e52ea09cc88a56d
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/codecov" \
            "https://github.com/codecov/codecov-cli/releases/download/$CODECOV_CLI_VERSION/codecovcli_linux"
          echo "$CODECOV_CLI_SHA256  $RUNNER_TEMP/codecov" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/codecov"
      - name: Upload coverage to Codecov
        id: codecov
        if: ${{ !cancelled() && steps.codecov-cli.outcome == 'success' }}
        continue-on-error: true
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          binary: ${{ runner.temp }}/codecov
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.xml
          fail_ci_if_error: true
      - name: Wait before retrying the Codecov upload
        if: ${{ !cancelled() && steps.codecov.outcome == 'failure' }}
        run: sleep 30
      - name: Retry the Codecov upload
        id: codecov-retry
        if: ${{ !cancelled() && steps.codecov.outcome == 'failure' }}
        continue-on-error: true
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          binary: ${{ runner.temp }}/codecov
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.xml
          fail_ci_if_error: true
      # Non-blocking by design: Codecov reports coverage, it never gates it, so
      # a Codecov outage must not fail CI Required. A missed upload surfaces
      # as a warning annotation and a job summary line instead.
      - name: Report a failed Codecov upload
        if:
          ${{ !cancelled() && steps.codecov.outcome != 'success' && steps.codecov-retry.outcome !=
          'success' }}
        run: |
          echo "::warning title=Codecov upload failed::coverage was not uploaded to Codecov after a retry"
          echo "Codecov upload failed after a retry. See the upload steps in this job." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  docs:
    name: Docs
    needs: changes
    # Full tier: the API docs build only on the main hop, where a release is
    # cut from. pdoc imports every module, so a warning (a module that
    # fails to import, a bad reference) fails it.
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.is-main == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - name: Build the API docs (pdoc)
        run: |
          set -euo pipefail
          packages=()
          for init in src/*/__init__.py; do packages+=("$(basename "$(dirname "$init")")"); done
          uv run --no-sync --with pdoc==16.0.0 python -W error -m pdoc -o "$RUNNER_TEMP/docs" "${packages[@]}"

  image-pins:
    name: Image Pins
    # Every image reference in the repo must match the vendored dx registry
    # (Decision qualithm/pm#744, amendment 2026-10-03). Runs on every PR, docs
    # included: a README can carry an image reference too. A repo with no
    # vendored registry references no container image and skips.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check image pins against the vendored dx registry
        run: |
          if [ ! -f .github/images/images.config ]; then
            echo "no vendored registry: repo references no container image; skipping"
            exit 0
          fi
          .github/images/images check --config .github/images/images.config .

  # The python-lib variant's runtime job (see bun-lib-mqtt.yaml): the shared
  # core's tests on MicroPython's Unix port, and its .mpy compile check.
  # dx:micropython-job-begin
  micropython:
    name: Test (MicroPython Unix port)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/qualithm/micropython-${{ env.MICROPYTHON_VERSION }}
          key: micropython-${{ runner.os }}-${{ runner.arch }}-${{ env.MICROPYTHON_VERSION }}
      # Builds once per version per machine, locally too, into a shared cache:
      # the Unix port, mpy-cross, and the tag's own unittest from micropython-lib.
      # FFI is left out: no test needs it, and macOS has no ffi.h by default.
      - name: Build the pinned MicroPython toolchain
        run: |
          tc="$HOME/.cache/qualithm/micropython-$MICROPYTHON_VERSION"
          if [[ -x "$tc/micropython" && -x "$tc/mpy-cross" && -f "$tc/lib/unittest/__main__.py" ]]; then
            echo "MicroPython $MICROPYTHON_VERSION toolchain is built at $tc"
            exit 0
          fi
          src="$(mktemp -d)"
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch "v$MICROPYTHON_VERSION" \
            https://github.com/micropython/micropython "$src"
          jobs="$(getconf _NPROCESSORS_ONLN)"
          make -s -C "$src/mpy-cross" -j "$jobs"
          make -s -C "$src/ports/unix" submodules
          make -s -C "$src/ports/unix" -j "$jobs" MICROPY_PY_FFI=0
          stdlib="$src/lib/micropython-lib/python-stdlib"
          rm -rf "$tc.partial"
          mkdir -p "$tc.partial/lib/unittest"
          cp "$src/ports/unix/build-standard/micropython" "$src/mpy-cross/build/mpy-cross" "$tc.partial/"
          cp "$stdlib/unittest/unittest/__init__.py" "$stdlib/unittest-discover/unittest/__main__.py" \
            "$tc.partial/lib/unittest/"
          cp "$stdlib/argparse/argparse.py" "$stdlib/fnmatch/fnmatch.py" "$tc.partial/lib/"
          rm -rf "$tc" "$src"
          mv "$tc.partial" "$tc"
      - name: Check the Unix port and mpy-cross match the pin
        run: |
          tc="$HOME/.cache/qualithm/micropython-$MICROPYTHON_VERSION"
          python3 .github/micropython-package toolchain --micropython "$tc/micropython" --mpy-cross "$tc/mpy-cross"
      # The fakes come first so `machine` and `network` resolve to them, then
      # the package, then unittest; .frozen keeps the port's own modules.
      - name: Run the tests on the Unix port
        run: |
          tc="$HOME/.cache/qualithm/micropython-$MICROPYTHON_VERSION"
          MICROPYPATH="tests/fakes:src:$tc/lib:.frozen" "$tc/micropython" -m unittest discover -s tests
      - name: Compile the shipped modules with mpy-cross
        run: |
          tc="$HOME/.cache/qualithm/micropython-$MICROPYTHON_VERSION"
          out="$(mktemp -d)"
          python3 .github/micropython-package compile "$out" --mpy-cross "$tc/mpy-cross"
          rm -rf "$out"
  # dx:micropython-job-end
  ci-required:
    name: CI Required
    if: always()
    needs: [changes, lint, typecheck, test, build, coverage, micropython, docs, image-pins]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify dependent jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")' \
            || { echo "::error::One or more required jobs failed or were cancelled"; exit 1; }
