# Generated by dx/scripts/audit-sync from ci-templates/audit-python.yaml.
# Do not edit directly — change the template and re-run audit-sync.

name: Security Audit

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHON_VERSION: "3.14.7"
  UV_VERSION: "0.12.17"
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  pip-audit:
    name: Python Vulnerability Check (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          # Never true: a cache saved here would claim CI's key on the default
          # branch with a smaller footprint than CI's own.
          enable-cache: false
      # Audits exactly what uv.lock pins, every dependency group included,
      # hashed so pip-audit checks the lock without resolving anything itself.
      - name: Export the locked dependencies
        run:
          uv export --locked --all-groups --no-emit-project --format requirements-txt -o
          "$RUNNER_TEMP/requirements.txt"
      - name: Run pip-audit
        id: scan
        continue-on-error: true
        run: |
          uvx --from "pip-audit==${PIP_AUDIT_VERSION}" pip-audit --strict --disable-pip \
            --requirement "$RUNNER_TEMP/requirements.txt"
      - name: Create app token for pm issue filing
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECTS_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_GH_APP_PRIVATE_KEY }}
          owner: qualithm
      - name: Report failure
        if: steps.scan.outcome == 'failure'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: report
          title: "${{ github.event.repository.name }}: pip-audit found a vulnerability"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Resolve stale failure issue
        if: steps.scan.outcome == 'success'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: resolve
          title: "${{ github.event.repository.name }}: pip-audit found a vulnerability"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Fail job if the scan failed
        if: steps.scan.outcome == 'failure'
        run: exit 1
